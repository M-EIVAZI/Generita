name: Software validation

on:
  push:
    branches:
      - test/software-validation
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore tests/Generita.Tests/Generita.Tests.csproj

      - name: Build
        run: dotnet build tests/Generita.Tests/Generita.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test tests/Generita.Tests/Generita.Tests.csproj
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=software-validation.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Prepare integration-test environment
        shell: bash
        run: |
          {
            echo "POSTGRES_PASSWORD=ci-postgres-password"
            echo "JWT_SECRET=ci-jwt-secret-with-at-least-thirty-two-characters"
            echo "ZARINPAL_MERCHANT_ID="
            echo "APPLY_MIGRATIONS_ON_STARTUP=true"
          } > .env

      - name: Build and start application stack
        run: docker compose up --build --detach

      - name: Wait for API health endpoint
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:7161/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs generita.api
          exit 1

      - name: Verify PostgreSQL, Redis, and cache behavior
        shell: pwsh
        run: ./scripts/Test-SystemHealth.ps1 -ApiBaseUrl http://localhost:7161

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop application stack
        if: always()
        run: docker compose down --volumes
